<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="50%" stop-color="#19152b"/>
      <stop offset="100%" stop-color="#0e0e12"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a476ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6942ce" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="radial1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#a476ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a476ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <rect width="600" height="400" fill="url(#radial1)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Decorative Window / Chat Card -->
  <rect x="50" y="50" width="500" height="300" rx="16" fill="#141419" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="78" cy="78" r="5" fill="#ff5f56"/>
  <circle cx="94" cy="78" r="5" fill="#ffbd2e"/>
  <circle cx="110" cy="78" r="5" fill="#27c93f"/>
  <line x1="50" y1="102" x2="550" y2="102" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- AI Badge -->
  <rect x="75" y="125" width="130" height="26" rx="13" fill="#a476ff" fill-opacity="0.15" stroke="#a476ff" stroke-opacity="0.3"/>
  <text x="140" y="142" fill="#d2b8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">AI AUTOMATION</text>

  <!-- Title & Description -->
  <text x="75" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">BRD-Generating LLM Chatbot</text>
  <text x="75" y="228" fill="#a5a5b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Automated requirement documents with Mistral 7B &amp; LLaVA</text>
  
  <!-- Metric Highlight Pill -->
  <rect x="75" y="260" width="220" height="42" rx="10" fill="#201a35" stroke="#a476ff" stroke-opacity="0.4"/>
  <text x="92" y="286" fill="#A9FF5B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">70% Manual Effort</text>
  <text x="235" y="286" fill="#c3c3d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Saved</text>

  <!-- Visual AI Graphic Elements -->
  <g transform="translate(420, 160)">
    <circle cx="40" cy="40" r="50" fill="#a476ff" fill-opacity="0.08"/>
    <circle cx="40" cy="40" r="32" fill="#a476ff" fill-opacity="0.15"/>
    <path d="M40 22 L45 35 L58 40 L45 45 L40 58 L35 45 L22 40 L35 35 Z" fill="#d2b8ff"/>
    <circle cx="70" cy="18" r="3" fill="#a476ff"/>
    <circle cx="15" cy="65" r="2.5" fill="#a476ff"/>
  </g>
</svg>
