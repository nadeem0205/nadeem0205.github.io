<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181310"/>
      <stop offset="50%" stop-color="#261b14"/>
      <stop offset="100%" stop-color="#120e0c"/>
    </linearGradient>
    <radialGradient id="radial4" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>
  <rect width="600" height="400" fill="url(#radial4)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Container Box -->
  <rect x="50" y="50" width="500" height="300" rx="16" fill="#1c1613" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="78" cy="78" r="5" fill="#ff5f56"/>
  <circle cx="94" cy="78" r="5" fill="#ffbd2e"/>
  <circle cx="110" cy="78" r="5" fill="#27c93f"/>
  <line x1="50" y1="102" x2="550" y2="102" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- Badge -->
  <rect x="75" y="125" width="160" height="26" rx="13" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3"/>
  <text x="155" y="142" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">DATA ENGINEERING</text>

  <!-- Title & Description -->
  <text x="75" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Airflow ETL &amp; Batch Pipelines</text>
  <text x="75" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Automated data processing with Celery task queues &amp; Redis</text>

  <!-- Metric Highlight Pill -->
  <rect x="75" y="260" width="240" height="42" rx="10" fill="#361f14" stroke="#f97316" stroke-opacity="0.4"/>
  <text x="92" y="286" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">30% Faster API</text>
  <text x="215" y="286" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">via Celery/Redis</text>

  <!-- DAG Pipeline Graphic -->
  <g transform="translate(390, 165)">
    <line x1="20" y1="40" x2="65" y2="20" stroke="#f97316" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="20" y1="40" x2="65" y2="60" stroke="#f97316" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="65" y1="20" x2="110" y2="40" stroke="#f97316" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="65" y1="60" x2="110" y2="40" stroke="#f97316" stroke-opacity="0.4" stroke-width="2"/>

    <rect x="5" y="26" width="30" height="28" rx="6" fill="#2b1a13" stroke="#f97316" stroke-width="1.5"/>
    <text x="20" y="44" fill="#fb923c" font-size="10" font-family="sans-serif" text-anchor="middle">Extract</text>

    <rect x="50" y="6" width="30" height="28" rx="6" fill="#2b1a13" stroke="#fb923c" stroke-width="1.5"/>
    <text x="65" y="24" fill="#fed7aa" font-size="10" font-family="sans-serif" text-anchor="middle">Clean</text>

    <rect x="50" y="46" width="30" height="28" rx="6" fill="#2b1a13" stroke="#fb923c" stroke-width="1.5"/>
    <text x="65" y="64" fill="#fed7aa" font-size="10" font-family="sans-serif" text-anchor="middle">Queue</text>

    <rect x="95" y="26" width="30" height="28" rx="6" fill="#2b1a13" stroke="#22c55e" stroke-width="1.5"/>
    <text x="110" y="44" fill="#4ade80" font-size="10" font-family="sans-serif" text-anchor="middle">Load</text>
  </g>
</svg>
