<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101318"/>
      <stop offset="50%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <radialGradient id="radial2" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)"/>
  <rect width="600" height="400" fill="url(#radial2)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Container Box -->
  <rect x="50" y="50" width="500" height="300" rx="16" fill="#131720" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="78" cy="78" r="5" fill="#ff5f56"/>
  <circle cx="94" cy="78" r="5" fill="#ffbd2e"/>
  <circle cx="110" cy="78" r="5" fill="#27c93f"/>
  <line x1="50" y1="102" x2="550" y2="102" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- Architecture Badge -->
  <rect x="75" y="125" width="180" height="26" rx="13" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3"/>
  <text x="165" y="142" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">EVENT-DRIVEN ARCHITECTURE</text>

  <!-- Title & Description -->
  <text x="75" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Kafka Microservices Hub</text>
  <text x="75" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Asynchronous producers/consumers with ZooKeeper orchestration</text>

  <!-- Metric Highlight Pill -->
  <rect x="75" y="260" width="240" height="42" rx="10" fill="#1b253b" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="92" y="286" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">10k+ Messages/Day</text>
  <text x="245" y="286" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Processed</text>

  <!-- Distributed Nodes Network Graphic -->
  <g transform="translate(380, 160)">
    <line x1="30" y1="40" x2="80" y2="20" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="80" y1="20" x2="130" y2="50" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="30" y1="40" x2="70" y2="80" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="70" y1="80" x2="130" y2="50" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
    
    <circle cx="30" cy="40" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="80" cy="20" r="14" fill="#1e293b" stroke="#a476ff" stroke-width="2.5"/>
    <circle cx="130" cy="50" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="70" cy="80" r="11" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

    <circle cx="80" cy="20" r="4" fill="#d2b8ff"/>
    <circle cx="30" cy="40" r="3" fill="#38bdf8"/>
    <circle cx="130" cy="50" r="3" fill="#38bdf8"/>
    <circle cx="70" cy="80" r="3" fill="#38bdf8"/>
  </g>
</svg>
