<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101813"/>
      <stop offset="50%" stop-color="#122319"/>
      <stop offset="100%" stop-color="#0c120e"/>
    </linearGradient>
    <radialGradient id="radial3" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)"/>
  <rect width="600" height="400" fill="url(#radial3)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Container Box -->
  <rect x="50" y="50" width="500" height="300" rx="16" fill="#111c15" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="78" cy="78" r="5" fill="#ff5f56"/>
  <circle cx="94" cy="78" r="5" fill="#ffbd2e"/>
  <circle cx="110" cy="78" r="5" fill="#27c93f"/>
  <line x1="50" y1="102" x2="550" y2="102" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- Badge -->
  <rect x="75" y="125" width="165" height="26" rx="13" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.3"/>
  <text x="157" y="142" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">QA &amp; TEST AUTOMATION</text>

  <!-- Title & Description -->
  <text x="75" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Playwright E2E &amp; API Suite</text>
  <text x="75" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Multi-browser automated UI/API regression suites &amp; coverage</text>

  <!-- Metric Highlight Pill -->
  <rect x="75" y="260" width="230" height="42" rx="10" fill="#172e20" stroke="#22c55e" stroke-opacity="0.4"/>
  <text x="92" y="286" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">+85% Test Coverage</text>
  <text x="245" y="286" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Achieved</text>

  <!-- Test Checklist Graphic -->
  <g transform="translate(400, 155)">
    <rect x="0" y="0" width="115" height="28" rx="6" fill="#14301f" stroke="#22c55e" stroke-opacity="0.3"/>
    <circle cx="16" cy="14" r="6" fill="#22c55e"/>
    <text x="30" y="18" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="600">PASS API Tests</text>

    <rect x="0" y="38" width="115" height="28" rx="6" fill="#14301f" stroke="#22c55e" stroke-opacity="0.3"/>
    <circle cx="16" cy="52" r="6" fill="#22c55e"/>
    <text x="30" y="56" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="600">PASS E2E Suites</text>

    <rect x="0" y="76" width="115" height="28" rx="6" fill="#14301f" stroke="#22c55e" stroke-opacity="0.3"/>
    <circle cx="16" cy="90" r="6" fill="#22c55e"/>
    <text x="30" y="94" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="600">PASS MultiBrowser</text>
  </g>
